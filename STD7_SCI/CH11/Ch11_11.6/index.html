    <script>
      // Remove Jinno welcome banner immediately
      (function() {
        function removeJinnoBanner() {
          const banner = document.getElementById('fixMeDetectBox');
          if (banner) {
            banner.remove();
            return true;
          }
          // Also try to find by class names
          const selectors = [
            '#fixMeDetectBox',
            '[id*="fixMeDetectBox"]',
            '[class*="QGTnaluzDSScJ7wCszV2cQ"]',
            '[class*="mpoSTLYU6AlhOHdEHp8JLA"]',
            '[class*="AAtMqR0kaWf53vl4uWregA"]'
          ];
          for (const selector of selectors) {
            try {
              const elements = document.querySelectorAll(selector);
              elements.forEach(el => {
                const text = el.textContent || '';
                if (text.includes('Welcome to Jinno') || text.includes('Start for free')) {
                  el.remove();
                }
              });
            } catch(e) {}
          }
          return false;
        }
        
        // Try immediately
        if (removeJinnoBanner()) {
          return;
        }
        
        // Try on DOMContentLoaded
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', removeJinnoBanner);
        }
        
        // Use MutationObserver to catch dynamically added elements
        const observer = new MutationObserver(function(mutations) {
          if (removeJinnoBanner()) {
            observer.disconnect();
          }
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: true
        });
        
        // Also try periodically as fallback
        const interval = setInterval(function() {
          if (removeJinnoBanner()) {
            clearInterval(interval);
            observer.disconnect();
          }
        }, 100);
        
        // Stop after 10 seconds
        setTimeout(function() {
          clearInterval(interval);
          observer.disconnect();
        }, 10000);
      })();
