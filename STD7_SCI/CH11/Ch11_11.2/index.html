<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Sources of Light </title>
  </head>
  <body>
    <style>
      html, body {
        font-family: "Poppins", "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gujarati", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      /* Hide Jinno banner completely */
      [id*="fixMeDetectBox"],
      [class*="jinno"],
      [id*="jinno"],
      [class*="Jinno"],
      [id*="Jinno"],
      [data-jinno],
      iframe[src*="jinno"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        left: -9999px !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        function hideJinnoBanner() {
          const selectors = [
            '[id*="fixMeDetectBox"]',
            '[class*="jinno"]',
            '[id*="jinno"]',
            '[class*="Jinno"]',
            '[id*="Jinno"]',
            '[data-jinno]',
            'iframe[src*="jinno"]'
          ];
          selectors.forEach(selector => {
            try {
              document.querySelectorAll(selector).forEach(el => {
                if (el.textContent && (el.textContent.includes('Welcome to Jinno') || el.textContent.includes('Start for free') || el.textContent.includes('login'))) {
                  el.remove();
                }
              });
            } catch(e) {}
          });
        }
        hideJinnoBanner();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', hideJinnoBanner);
        }
        const observer = new MutationObserver(hideJinnoBanner);
        observer.observe(document.body, { childList: true, subtree: true });
        setInterval(hideJinnoBanner, 100);
        setTimeout(() => observer.disconnect(), 10000);
      })();
    </script>
    <div id="root"></div>
    <script>
      // Comprehensive browser extension error suppression - runs immediately
      (function() {
        'use strict';
        
        // Helper function for case-insensitive pattern matching
        function suppressExtensionError(message) {
          if (!message) return false;
          const lowerMessage = String(message).toLowerCase();
          const patterns = [
            'runtime.lasterror',
            'runtime.lastError',
            'runtime.last_error',
            'unchecked runtime.lasterror',
            'unchecked runtime.lasterror',
            'unchecked runtime.last_error',
            'message port closed',
            'message port closed before a response',
            'message port closed before a response was received',
            'the message port closed before a response was received',
            'extension context invalidated',
            'chrome.runtime.lastError',
            'chrome.runtime.lasterror',
            'chrome-extension://',
            'moz-extension://',
            'safari-extension://',
            'extension://',
            'lastError',
            'lasterror',
            'port closed',
            'port closed before'
          ];
          return patterns.some(function(pattern) {
            return lowerMessage.indexOf(pattern) !== -1;
          });
        }
        
        // Suppress Chrome runtime.lastError if Chrome API exists
        if (typeof chrome !== 'undefined' && chrome.runtime) {
          try {
            // Store original lastError getter if it exists
            var originalLastError = chrome.runtime.lastError;
            
            // Wrap chrome.runtime.sendMessage to catch and suppress errors
            if (chrome.runtime.sendMessage) {
              var originalSendMessage = chrome.runtime.sendMessage;
              chrome.runtime.sendMessage = function() {
                try {
                  var result = originalSendMessage.apply(this, arguments);
                  // Check for lastError after sendMessage
                  if (chrome.runtime.lastError) {
                    // Suppress the error silently
                    return;
                  }
                  return result;
                } catch (e) {
                  var errorMsg = String(e.message || e || '');
                  if (suppressExtensionError(errorMsg)) {
                    return;
                  }
                  throw e;
                }
              };
            }
          } catch (e) {
            // Silently fail if we can't wrap the API
          }
        }
        
        // Store original console methods
        var originalConsole = {
          error: console.error,
          warn: console.warn,
          log: console.log,
          info: console.info,
          debug: console.debug
        };
        
        // Override console.error with more aggressive checking
        console.error = function() {
          var args = Array.from(arguments);
          var fullMessage = args.map(function(arg) { 
            // Handle Error objects, strings, and other types
            if (arg instanceof Error) {
              return String(arg.message || arg.stack || arg.name || arg);
            }
            return String(arg || ''); 
          }).join(' ');
          
          // Check the full message and each individual argument
          if (suppressExtensionError(fullMessage)) {
            return; // Silently ignore
          }
          
          // Also check individual arguments
          for (var i = 0; i < args.length; i++) {
            if (suppressExtensionError(String(args[i] || ''))) {
              return; // Silently ignore
            }
          }
          
          originalConsole.error.apply(console, args);
        };
        
        // Override console.warn (extensions sometimes use warn)
        console.warn = function() {
          var args = Array.from(arguments);
          var fullMessage = args.map(function(arg) { 
            if (arg instanceof Error) {
              return String(arg.message || arg.stack || arg.name || arg);
            }
            return String(arg || ''); 
          }).join(' ');
          
          if (suppressExtensionError(fullMessage)) {
            return; // Silently ignore
          }
          
          // Check individual arguments
          for (var i = 0; i < args.length; i++) {
            if (suppressExtensionError(String(args[i] || ''))) {
              return; // Silently ignore
            }
          }
          
          originalConsole.warn.apply(console, args);
        };
        
        // Also intercept console.log for safety
        var originalLog = console.log;
        console.log = function() {
          var args = Array.from(arguments);
          var fullMessage = args.map(function(arg) { return String(arg || ''); }).join(' ');
          if (suppressExtensionError(fullMessage)) {
            return; // Silently ignore
          }
          originalLog.apply(console, args);
        };
        
        // Handle unhandled errors from browser extensions (capture phase)
        window.addEventListener('error', function(event) {
          var errorMessage = (event.message || '').toLowerCase();
          var errorSource = (event.filename || '').toLowerCase();
          var errorTarget = (event.target && event.target.src) ? event.target.src.toLowerCase() : '';
          
          if (
            suppressExtensionError(errorMessage) ||
            suppressExtensionError(errorSource) ||
            suppressExtensionError(errorTarget) ||
            errorSource.indexOf('extension://') !== -1 ||
            errorSource.indexOf('chrome-extension://') !== -1 ||
            errorSource.indexOf('moz-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }
        }, true); // Use capture phase to catch early
        
        // Catch unhandled promise rejections from extensions
        window.addEventListener('unhandledrejection', function(event) {
          var errorMessage = String(event.reason || '').toLowerCase();
          var errorStack = String((event.reason && event.reason.stack) || '').toLowerCase();
          
          if (
            suppressExtensionError(errorMessage) ||
            suppressExtensionError(errorStack) ||
            errorStack.indexOf('extension://') !== -1 ||
            errorStack.indexOf('chrome-extension://') !== -1 ||
            errorStack.indexOf('moz-extension://') !== -1
          ) {
            event.preventDefault();
            event.stopPropagation();
            event.stopImmediatePropagation();
            return false;
          }
        });
        
      })();
    </script>
