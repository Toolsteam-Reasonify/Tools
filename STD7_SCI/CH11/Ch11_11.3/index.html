<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- CRITICAL: Error suppression must run FIRST, before any other scripts -->
    <script>
      // Ultra-early error suppression - runs before anything else
      (function() {
        'use strict';
        // Immediately suppress Chrome runtime errors
        if (typeof chrome !== 'undefined' && chrome && chrome.runtime) {
          try {
            // Completely override lastError
            var lastErrorDescriptor = Object.getOwnPropertyDescriptor(chrome.runtime, 'lastError');
            if (!lastErrorDescriptor || lastErrorDescriptor.configurable) {
              Object.defineProperty(chrome.runtime, 'lastError', {
                get: function() { return undefined; },
                set: function() {},
                configurable: true,
                enumerable: false
              });
            }
          } catch(e) {}
        }
        
        // Suppress console errors immediately
        var patterns = ['runtime.lastError', 'message port closed', 'extension'];
        var origError = console.error;
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).join(' ').toLowerCase();
          if (patterns.some(function(p) { return msg.indexOf(p) !== -1; })) return;
          origError.apply(console, arguments);
        };
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sources of Light </title>
    <!-- Early error suppression for browser extension errors - runs FIRST -->
    <script>
      (function() {
        'use strict';
        // Comprehensive patterns
        var patterns = [
          'runtime.lastError', 'runtime.lasterror', 'runtime.last_error',
          'unchecked runtime.lastError', 'unchecked runtime.lasterror',
          'message port closed', 'message port closed before a response',
          'message port closed before a response was received',
          'extension context invalidated', 'chrome-extension://',
          'moz-extension://', 'safari-extension://', 'extension://',
          'lastError', 'lasterror', 'the message port closed',
          'port closed before', 'a listener indicated an asynchronous response'
        ];
        
        function shouldSuppress(msg) {
          if (!msg) return false;
          var lower = String(msg).toLowerCase();
          return patterns.some(function(p) { return lower.indexOf(p.toLowerCase()) !== -1; });
        }
        
        // Override console methods immediately
        var originalError = console.error;
        var originalWarn = console.warn;
        var originalLog = console.log;
        
        console.error = function() {
          var msg = Array.prototype.slice.call(arguments).join(' ');
          if (shouldSuppress(msg)) return;
          originalError.apply(console, arguments);
        };
        
        console.warn = function() {
          var msg = Array.prototype.slice.call(arguments).join(' ');
          if (shouldSuppress(msg)) return;
          originalWarn.apply(console, arguments);
        };
        
        console.log = function() {
          var msg = Array.prototype.slice.call(arguments).join(' ');
          if (shouldSuppress(msg)) return;
          originalLog.apply(console, arguments);
        };
        
        // Suppress Chrome runtime errors at the source
        if (typeof chrome !== 'undefined' && chrome.runtime) {
          try {
            // Override lastError to always return undefined
            Object.defineProperty(chrome.runtime, 'lastError', {
              get: function() { return undefined; },
              configurable: true
            });
            
            // Wrap sendMessage
            if (chrome.runtime.sendMessage) {
              var origSend = chrome.runtime.sendMessage;
              chrome.runtime.sendMessage = function() {
                try {
                  return origSend.apply(this, arguments);
                } catch(e) {
                  return;
                }
              };
            }
          } catch(e) {}
        }
        
        // Global error handlers
        window.addEventListener('error', function(e) {
          var msg = (e.message || '').toLowerCase();
          var source = (e.filename || '').toLowerCase();
          if (shouldSuppress(msg) || shouldSuppress(source) || 
              source.indexOf('extension://') !== -1 ||
              source.indexOf('chrome-extension://') !== -1) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
        
        window.addEventListener('unhandledrejection', function(e) {
          var msg = String(e.reason || '').toLowerCase();
          if (shouldSuppress(msg)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <style>
      html, body {
        font-family: "Poppins", "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gujarati", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
      /* Hide Jinno banner completely */
      [id*="fixMeDetectBox"],
      [class*="jinno"],
      [id*="jinno"],
      [class*="Jinno"],
      [id*="Jinno"],
      [data-jinno],
      iframe[src*="jinno"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
        overflow: hidden !important;
        position: absolute !important;
        left: -9999px !important;
        pointer-events: none !important;
      }
    </style>
    <script>
      (function() {
        function hideJinnoBanner() {
          const selectors = [
            '[id*="fixMeDetectBox"]',
            '[class*="jinno"]',
            '[id*="jinno"]',
            '[class*="Jinno"]',
            '[id*="Jinno"]',
            '[data-jinno]',
            'iframe[src*="jinno"]'
          ];
          selectors.forEach(selector => {
            try {
              document.querySelectorAll(selector).forEach(el => {
                if (el.textContent && (el.textContent.includes('Welcome to Jinno') || el.textContent.includes('Start for free') || el.textContent.includes('login'))) {
                  el.remove();
                }
              });
            } catch(e) {}
          });
        }
        hideJinnoBanner();
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', hideJinnoBanner);
        }
        const observer = new MutationObserver(hideJinnoBanner);
        observer.observe(document.body, { childList: true, subtree: true });
        setInterval(hideJinnoBanner, 100);
        setTimeout(() => observer.disconnect(), 10000);
      })();
    </script>
    <div id="root"></div>
    <script>
      // Comprehensive browser extension error suppression - runs immediately
      (function() {
        'use strict';
        
        // Helper function for case-insensitive pattern matching
        function suppressExtensionError(message) {
          if (!message) return false;
          const lowerMessage = String(message).toLowerCase();
          const patterns = [
            'runtime.lasterror',
            'runtime.lastError',
            'runtime.last_error',
            'unchecked runtime.lasterror',
            'unchecked runtime.lastError',
            'message port closed',
            'message port closed before a response',
            'message port closed before a response was received',
            'extension context invalidated',
            'chrome.runtime.lastError',
            'chrome.runtime.lasterror',
            'chrome-extension://',
            'moz-extension://',
            'safari-extension://',
            'extension://',
            'lastError',
            'lasterror',
            'the message port closed',
            'port closed before',
            'a listener indicated an asynchronous response'
          ];
          return patterns.some(function(pattern) {
            return lowerMessage.indexOf(pattern) !== -1;
          });
        }
        
        // Store original console methods
        var originalConsole = {
          error: console.error,
          warn: console.warn,
          log: console.log,
          info: console.info,
          debug: console.debug
        };
        
        // Override console.error
        console.error = function() {
          try {
            var args = Array.from(arguments);
            var fullMessage = args.map(function(arg) { return String(arg || ''); }).join(' ');
            if (suppressExtensionError(fullMessage)) {
              return; // Silently ignore
            }
            originalConsole.error.apply(console, args);
          } catch (e) {
            // Fallback if error occurs during suppression
            originalConsole.error.apply(console, arguments);
          }
        };
        
        // Override console.warn (extensions sometimes use warn)
        console.warn = function() {
          var args = Array.from(arguments);
          var fullMessage = args.map(function(arg) { return String(arg || ''); }).join(' ');
          if (suppressExtensionError(fullMessage)) {
            return; // Silently ignore
          }
          originalConsole.warn.apply(console, args);
        };
        
        // Also intercept console.log for safety
        var originalLog = console.log;
        console.log = function() {
          var args = Array.from(arguments);
          var fullMessage = args.map(function(arg) { return String(arg || ''); }).join(' ');
          if (suppressExtensionError(fullMessage)) {
            return; // Silently ignore
          }
          originalLog.apply(console, args);
        };
        
        // Handle unhandled errors from browser extensions (capture phase)
        window.addEventListener('error', function(event) {
          try {
            var errorMessage = (event.message || '').toLowerCase();
            var errorSource = (event.filename || '').toLowerCase();
            var errorTarget = (event.target && event.target.src) ? event.target.src.toLowerCase() : '';
            var errorStack = (event.error && event.error.stack) ? String(event.error.stack).toLowerCase() : '';
            
            if (
              suppressExtensionError(errorMessage) ||
              suppressExtensionError(errorSource) ||
              suppressExtensionError(errorTarget) ||
              suppressExtensionError(errorStack) ||
              errorSource.indexOf('extension://') !== -1 ||
              errorSource.indexOf('chrome-extension://') !== -1 ||
              errorSource.indexOf('moz-extension://') !== -1 ||
              errorSource.indexOf('safari-extension://') !== -1
            ) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              return false;
            }
          } catch (e) {
            // Ignore errors in error handler
          }
        }, true); // Use capture phase to catch early
        
        // Catch unhandled promise rejections from extensions
        window.addEventListener('unhandledrejection', function(event) {
          try {
            var errorMessage = String(event.reason || '').toLowerCase();
            var reason = event.reason || {};
            var errorStack = String(reason.stack || '').toLowerCase();
            var reasonMessage = String(reason.message || '').toLowerCase();
            
            if (
              suppressExtensionError(errorMessage) ||
              suppressExtensionError(errorStack) ||
              suppressExtensionError(reasonMessage) ||
              errorStack.indexOf('extension://') !== -1 ||
              errorStack.indexOf('chrome-extension://') !== -1 ||
              errorStack.indexOf('moz-extension://') !== -1 ||
              errorStack.indexOf('safari-extension://') !== -1
            ) {
              event.preventDefault();
              event.stopPropagation();
              event.stopImmediatePropagation();
              return false;
            }
          } catch (e) {
            // Ignore errors in error handler
          }
        });
        
        // Suppress Chrome runtime errors directly - more aggressive
        if (typeof chrome !== 'undefined' && chrome.runtime) {
          try {
            // Try to override lastError getter
            try {
              Object.defineProperty(chrome.runtime, 'lastError', {
                get: function() { return undefined; },
                configurable: true
              });
            } catch(e) {}
            
            // Wrap all chrome.runtime methods
            var methods = ['sendMessage', 'connect', 'sendNativeMessage'];
            methods.forEach(function(methodName) {
              if (chrome.runtime[methodName]) {
                var original = chrome.runtime[methodName];
                chrome.runtime[methodName] = function() {
                  try {
                    var result = original.apply(this, arguments);
                    // Check for lastError after call
                    if (chrome.runtime.lastError) {
                      return;
                    }
                    return result;
                  } catch (e) {
                    return;
                  }
                };
              }
            });
          } catch (e) {
            // Ignore if chrome.runtime is not accessible
          }
        }
        
      })();
    </script>
