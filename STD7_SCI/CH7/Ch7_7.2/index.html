<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Heat Transfer in Nature</title>
  </head>
  <body>
    <style>
      html, body {
        font-family: "Poppins", "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gujarati", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Safe removal of grey banner blocks - only targets elements outside #root
      function removeGreyBanners() {
        try {
          const root = document.getElementById('root');
          if (!root || !document.body) return;
          
          // Only check direct children of body (where banners are usually injected)
          Array.from(document.body.children).forEach(el => {
            if (el.id === 'root') return; // Never touch root
            
            const computed = window.getComputedStyle(el);
            const bgColor = computed.backgroundColor.toLowerCase();
            const text = (el.textContent || '').toLowerCase();
            
            // Only remove if it's clearly a Jinno banner
            if (text.includes('jinno') || text.includes('jinnos') || 
                (text.includes('welcome') && text.includes('feature'))) {
              el.style.cssText = 'display: none !important; visibility: hidden !important; opacity: 0 !important;';
              return;
            }
            
            // Check for grey banners outside root
            const isGrey = bgColor.includes('rgb(128') || 
                          bgColor.includes('grey') || 
                          bgColor.includes('gray');
            
            if (isGrey && computed.borderRadius !== '0px' && 
                el.offsetHeight > 30 && el.offsetHeight < 150 &&
                !root.contains(el)) {
              el.style.cssText = 'display: none !important; visibility: hidden !important; opacity: 0 !important;';
            }
          });
        } catch (e) {
          // Silent fail
        }
      }
      
      // Wait for DOM to be ready
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => {
          setTimeout(removeGreyBanners, 500); // Wait for React to render
        });
      } else {
        setTimeout(removeGreyBanners, 500);
      }
      
      // Watch only for new direct children of body
      if (document.body) {
        const observer = new MutationObserver(function(mutations) {
          mutations.forEach(function(mutation) {
            mutation.addedNodes.forEach(function(node) {
              if (node.nodeType === 1 && node.id !== 'root') {
                setTimeout(removeGreyBanners, 100);
              }
            });
          });
        });
        
        observer.observe(document.body, {
          childList: true,
          subtree: false // Only watch direct children
        });
      }
    </script>
    <style>
      /* Aggressive CSS to hide grey banners - targeting common patterns */
      body > div:not(#root):not([id^="react"]):not([id^="__"]) {
        /* Check all direct children of body that might be banners */
      }
      
      /* Hide any element with grey background in inline styles */
      [style*="rgb(128, 128"],
      [style*="rgb(128,128"],
      [style*="background-color: grey"],
      [style*="background: grey"],
      [style*="background-color: gray"],
      [style*="background: gray"],
      [style*="rgba(128"] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        max-height: 0 !important;
        overflow: hidden !important;
        pointer-events: none !important;
      }
    </style>
  </body>
</html>
