<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Noto+Sans:wght@400;600;700&family=Noto+Sans+Devanagari:wght@400;600;700&family=Noto+Sans+Gujarati:wght@400;600;700&display=swap" rel="stylesheet">
    <title>Water Cycle </title>
  </head>
  <body>
    <style>
      html, body {
        font-family: "Poppins", "Noto Sans", "Noto Sans Devanagari", "Noto Sans Gujarati", system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, "Helvetica Neue", Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }
    </style>
    <div id="root"></div>
    <script>
      // Enhanced error handling for Chrome extension runtime errors before React loads
      (function() {
        const originalError = console.error;
        const originalWarn = console.warn;
        
        // Type guard for Chrome extension API
        function hasChromeRuntime() {
          try {
            return typeof window !== 'undefined' && 
                   typeof window.chrome !== 'undefined' && 
                   window.chrome.runtime !== undefined;
          } catch {
            return false;
          }
        }
        
        // Check if error is from browser extension (should be suppressed)
        function isExtensionError(message) {
          if (!message) return false;
          const lowerMessage = message.toLowerCase();
          return (
            lowerMessage.includes('runtime.lasterror') ||
            lowerMessage.includes('message port closed') ||
            lowerMessage.includes('extension context invalidated') ||
            lowerMessage.includes('unchecked runtime.lasterror') ||
            lowerMessage.includes('receiving end does not exist') ||
            lowerMessage.includes('could not establish connection')
          );
        }
        
        // Suppress browser extension errors
        console.error = function() {
          const args = Array.from(arguments);
          const errorMessage = args[0]?.toString() || '';
          
          if (isExtensionError(errorMessage)) {
            return; // Silently suppress
          }
          
          // Check Chrome runtime errors
          if (hasChromeRuntime()) {
            try {
              if (window.chrome.runtime.lastError) {
                const lastError = window.chrome.runtime.lastError;
                if (lastError.message && isExtensionError(lastError.message)) {
                  return; // Suppress
                }
              }
            } catch (e) {
              // Ignore
            }
          }
          
          originalError.apply(console, args);
        };
        
        // Suppress warnings for extension errors
        console.warn = function() {
          const args = Array.from(arguments);
          const warnMessage = args[0]?.toString() || '';
          
          if (isExtensionError(warnMessage)) {
            return; // Silently suppress
          }
          
          originalWarn.apply(console, args);
        };
        
        // Handle unhandled errors
        window.addEventListener('error', function(event) {
          const errorMessage = event.message || '';
          
          if (isExtensionError(errorMessage)) {
            event.preventDefault();
            event.stopPropagation();
            return false;
          }
        }, true);
        
        // Handle unhandled promise rejections
        window.addEventListener('unhandledrejection', function(event) {
          const errorMessage = event.reason?.message || event.reason?.toString() || '';
          
          if (isExtensionError(errorMessage)) {
            event.preventDefault();
            return false;
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
